<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case File · The Case of the Missing Candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../print.css">
<style>
  .hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; padding-top: 8px; }
  .hdr .case { font-family: "Fredoka", sans-serif; font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hdr h1 { font-size: 22pt; margin: 2px 0 0; }
  .squadtag { text-align: right; }
  .squadtag .name { font-family: "Fredoka", sans-serif; font-size: 16pt; font-weight: 600; color: var(--squad); margin-left: auto; }
  .page { --squad: #5b21b6; }
  table.sus th:nth-child(4), table.sus td:nth-child(4) { min-width: 1.6in; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
  .facts div { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 9.5pt; }
  .facts b { display: block; font-family: "Fredoka", sans-serif; font-size: 8pt; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stolen { border: 2px solid var(--ink); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; display: flex; gap: 14px; align-items: center; font-size: 10.5pt; }
  .stolen .big { font-family: "Fredoka", sans-serif; font-size: 18pt; letter-spacing: .08em; }
  table.sus td, table.sus th { padding: 3px 7px; font-size: 9.5pt; }
  table.sus td:first-child { width: 28px; text-align: center; }
  .ev { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .ev .row { border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 10px; display: grid; grid-template-columns: 1.35in 1fr 1.55in; gap: 10px; align-items: end; font-size: 10pt; }
  .ev .row b { font-family: "Fredoka", sans-serif; font-weight: 600; }
  .ev .row .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--squad); color: #fff; font-size: 9.5pt; margin-right: 4px; }
  .vid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .vid div { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; height: .62in; font-size: 9.5pt; }
  .vid b { display: block; font-family: "Fredoka", sans-serif; font-weight: 600; }
  .order { display: flex; gap: 10px; align-items: center; font-size: 10pt; flex-wrap: wrap; }
  .order { font-size: 8.5pt; gap: 4px; flex-wrap: nowrap; }
  .order .st { border: 2px solid var(--squad); border-radius: 8px; padding: 2px 6px; font-weight: 800; white-space: nowrap; }
  .order .st small { display: inline; font-weight: 400; font-size: 7.5pt; color: var(--muted); margin-left: 4px; }
  .order .arrow { color: var(--muted); }
  .sec { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 11pt; margin: 9px 0 5px; display: flex; align-items: center; gap: 8px; }
  .sec::after { content: ""; flex: 1; border-top: 1.5px solid var(--line); }
  /* warrant */
  .warrant { border: 4px double var(--ink); padding: .4in; height: 100%; display: flex; flex-direction: column; }
  .warrant h1 { font-size: 34pt; letter-spacing: .08em; text-align: center; margin: 0; }
  .warrant .sub { text-align: center; font-family: "Fredoka", sans-serif; letter-spacing: .18em; text-transform: uppercase; font-size: 10pt; color: var(--muted); margin-bottom: 18px; }
  .warrant .we { font-size: 15pt; line-height: 2.1; }
  .warrant .because { flex: 1; margin-top: 10px; }
  .warrant .because .line { height: 2em; }
  .sigs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
  .sigs div { border-top: 1.5px solid var(--ink); padding-top: 4px; font-size: 8.5pt; color: var(--muted); text-align: center; }
  .seal { position: absolute; right: .9in; top: 1.1in; }
</style>
</head>
<body>
<div class="toolbar"><b>📁 Case file</b><span class="muted">2 pages · one case file and one arrest warrant. Print five (four squads and a spare).</span><span class="grow"></span><a href="../../events/halloween.html#downloads">← Back to the plan</a><a href="../../downloads/halloween/case-file.pdf" download>⬇ PDF</a><button class="primary" onclick="window.print()">🖨 Print</button></div>

<script>
const STATIONS = { 1: ["Evidence Lab", "👣"], 2: ["Ghostbuster Lab", "👻"], 3: ["Cipher Room", "📜"], 4: ["Mummy Witness", "🧻"] };
function casePage() {
  return `
<section class="page">
  <div class="hdr">
    <div><span class="tape"><span>Confidential</span></span><div class="case" style="margin-top:8px">Mrs. Driscoll's Detective Bureau · Case #1031</div><h1 style="white-space:nowrap">The Case of the Missing <span class="blank" style="min-width:1.7in"></span></h1></div>
    <div class="squadtag"><div class="case">Squad</div><div class="name" style="border-bottom:2px solid #111;min-width:1.2in;height:1.3em"></div><div class="small muted" style="white-space:nowrap">1 purple · 2 black · 3 teal · 4 orange</div></div>
  </div>
  <div class="facts">
    <div><b>Time of theft</b>Afternoon. Exactly when? <span class="blank" style="min-width:.55in"></span></div><div><b>Location</b>Mrs. Driscoll's room, the high shelf</div><div><b>Door</b>Locked</div><div><b>Window</b>Shut</div>
  </div>
  <div class="stolen"><span>Item stolen:</span><span class="big">CANDY</span><span class="muted small">If new information comes in, cross it out and correct it:</span><span class="blank long"></span></div>

  <div class="sec">Suspects</div>
  <table class="sus">
    <thead><tr><th></th><th>Name</th><th>Shoe size</th><th>Yesterday afternoon</th><th>Wore yesterday</th><th>Squishies?</th><th>Statement</th></tr></thead>
    <tbody>
      <tr><td><span class="chk"></span></td><td><strong>The Principal</strong></td><td>9</td><td>Off campus, 1:00 to 3:00</td><td>Blue</td><td>Loves them ("just one")</td><td>Video 1</td></tr>
      <tr><td><span class="chk"></span></td><td><strong>The Reading Specialist</strong></td><td>9</td><td>Reading room, all afternoon</td><td>Blue</td><td>Doesn't get them</td><td>Video 2</td></tr>
      <tr><td><span class="chk"></span></td><td><strong>The Librarian</strong></td><td>7</td><td>Shelving, 2:00 to 2:30</td><td>Blue</td><td>Loves them</td><td>Video 3</td></tr>
      <tr><td><span class="chk"></span></td><td><strong>The Custodian</strong></td><td>9</td><td>In the building, all afternoon</td><td>Gray</td><td>Loves them</td><td><em>Declined to comment</em></td></tr>
      <tr><td><span class="chk"></span></td><td><span class="blank" style="min-width:1.3in"></span><div class="tiny muted">Anyone else who fits?</div></td><td><span class="blank short"></span></td><td><span class="blank" style="min-width:.9in"></span></td><td><span class="blank short"></span></td><td><span class="blank" style="min-width:.9in"></span></td><td></td></tr>
    </tbody>
  </table>
  <p class="small muted" style="margin:6px 0 0">Typed from the suspects' own statement forms (originals on the wall). Rule of the Bureau: a clue tells you who <strong>didn't</strong> do it. Cross off anyone who doesn't match. Everyone crossed off? Ask the Detective for any statement not in this file.</p>

  <div class="sec">Evidence log <span class="small muted" style="font-weight:400;font-family:Nunito">(fill in after each station, then cross off suspects)</span></div>
  <div class="ev">
    <div class="row"><b><span class="n">1</span>Evidence Lab</b><span>Footprint = <span class="blank short"></span> cm = size <span class="blank short"></span> &nbsp; Powder is <span class="blank" style="min-width:1.2in"></span></span><span class="small">Clears: <span class="blank" style="min-width:1in"></span></span></div>
    <div class="row"><b><span class="n">2</span>Ghostbuster Lab</b><span>The five words say: <span class="blank long"></span></span><span class="small">Clears: <span class="blank" style="min-width:1in"></span></span></div>
    <div class="row"><b><span class="n">3</span>Cipher Room</b><span>Decoded note: <span class="blank" style="min-width:1.8in"></span> P.S.: <span class="blank" style="min-width:1.4in"></span></span><span class="small">Clears: <span class="blank" style="min-width:1in"></span></span></div>
    <div class="row"><b><span class="n">4</span>Mummy Witness</b><span>The witness saw: <span class="blank long"></span></span><span class="small">Clears: <span class="blank" style="min-width:1in"></span></span></div>
  </div>

  <div class="sec">Video notes <span class="small muted" style="font-weight:400;font-family:Nunito">(anything suspicious? anything funny?)</span></div>
  <div class="vid"><div><b>1 · The Principal</b></div><div><b>2 · The Reading Specialist</b></div><div><b>3 · The Librarian</b></div><div><b>4 · ???</b></div></div>

  <div class="sec">Station order <span class="small muted" style="font-weight:400;font-family:Nunito">(start at your squad number, then count up; after 4 comes 1; cross each off as you go)</span></div>
  <div class="order">${[1,2,3,4].map((n, i) => `<span class="st">${STATIONS[n][1]} ${n} · ${STATIONS[n][0]}</span>${i < 3 ? '<span class="arrow">→</span>' : ''}`).join("")}</div>
  <div class="footer-note"><span>Mrs. Driscoll's Detective Bureau · Case #1031</span><span>When all four clues are in, write your Arrest Warrant and drop it in the cauldron.</span></div>
</section>
<section class="page fill">
  <div class="warrant">
    <div class="seal"><span class="stamp">Official</span></div>
    <div class="case center" style="font-family:Fredoka;font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Mrs. Driscoll's Detective Bureau · Case #1031</div>
    <h1>Arrest Warrant</h1>
    <div class="sub">Issued by Squad <span class="blank" style="min-width:.6in"></span></div>
    <div class="we">We, the detectives of Squad <span class="blank" style="min-width:.6in"></span>, having examined all four pieces of evidence, hereby accuse</div>
    <div class="line" style="height:.7in;border-bottom-width:2.5px"></div>
    <div class="we" style="margin-top:6px">of taking the Jar from the high shelf at 2:15 PM, because:</div>
    <div class="because lines"><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span></div>
    <div class="we" style="font-size:12pt">The evidence that cleared everyone else: <span class="small muted">(check all that apply)</span></div>
    <div style="font-size:11pt;line-height:1.9"><span class="chk"></span> Footprint, size 9 &nbsp;&nbsp; <span class="chk"></span> Seen in hall at 2:15 &nbsp;&nbsp; <span class="chk"></span> Blue sweater &nbsp;&nbsp; <span class="chk"></span> Loves squishies</div>
    <div class="we" style="font-size:12pt;margin-top:6px">And the accused's own statement matches: <span class="small muted">(check all four)</span></div>
    <div style="font-size:11pt;line-height:1.9"><span class="chk"></span> Size 9 &nbsp;&nbsp; <span class="chk"></span> In the building at 2:15 &nbsp;&nbsp; <span class="chk"></span> Wore blue &nbsp;&nbsp; <span class="chk"></span> Loves squishies</div>
    <div class="sigs"><div>Detective</div><div>Detective</div><div>Detective</div><div>Detective</div><div>Detective</div></div>
    <p class="center small muted" style="margin:14px 0 0">Fold once. Drop in the cauldron. The Detective reads every warrant aloud before the final statement is played.</p>
  </div>
</section>`;
}
document.write(casePage());
</script>
</body>
</html>
