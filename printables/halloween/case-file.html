<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case File · The Case of the Missing Candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../print.css">
<style>
  .hdr { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; padding-top: 8px; }
  .hdr .case { font-family: "Fredoka", sans-serif; font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hdr h1 { font-size: 26pt; margin: 4px 0 0; }
  .squadtag { text-align: right; }
  .squadtag .name { font-family: "Fredoka", sans-serif; font-size: 16pt; font-weight: 600; margin-left: auto; }
  .squadtag .badge { display: inline-block; font-family: "Fredoka", sans-serif; font-size: 20pt; font-weight: 700; color: #fff; background: var(--squad); border-radius: 12px; padding: 4px 16px; white-space: nowrap; }
  .squadtag .badge.light { color: #111; }
  .page { --squad: #5b21b6; }
  .warrant .sq { display: inline-block; font-family: "Fredoka", sans-serif; font-weight: 700; color: #fff; background: var(--squad); border-radius: 10px; padding: 0 12px; line-height: 1.4; }
  .warrant .sq.light { color: #111; }
  .stolen { border: 2.5px solid var(--ink); border-radius: 10px; padding: 6px 12px; margin-bottom: 8px; display: flex; gap: 14px; align-items: center; font-size: 11.5pt; }
  .stolen .big { font-family: "Fredoka", sans-serif; font-size: 18pt; letter-spacing: .06em; white-space: nowrap; }
  .sec { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 13pt; margin: 10px 0 6px; display: flex; align-items: center; gap: 8px; }
  .sec::after { content: ""; flex: 1; border-top: 1.5px solid var(--line); }
  .sec small { font-family: "Nunito", sans-serif; font-weight: 400; font-size: 9.5pt; color: var(--muted); }
  table.sus { font-size: 10.5pt; }
  table.sus td, table.sus th { padding: 5px 8px; white-space: nowrap; }
  table.sus td:first-child { font-size: 11pt; }
  .rule { border: 2.5px solid var(--ink); border-radius: 10px; padding: 7px 12px; margin: 8px 0 0; font-size: 11.5pt; font-weight: 800; text-align: center; }
  .ev { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .ev .row { border: 2px solid var(--line); border-radius: 10px; padding: 4px 12px 8px; font-size: 12pt; }
  .ev .row .top { display: flex; align-items: flex-end; }
  .ev .row.one { display: flex; align-items: flex-end; gap: 14px; }
  .ev .row.one .w { flex: 1; margin-top: 0; }
  .ev .row b { font-family: "Fredoka", sans-serif; font-weight: 600; white-space: nowrap; }
  .ev .row .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--squad); color: #fff; font-size: 10pt; margin-right: 5px; }
  .ev .row .w { display: flex; gap: 8px; align-items: flex-end; margin-top: 4px; white-space: nowrap; }
  .ev .row .wl { flex: 1; border-bottom: 1.5px solid var(--ink); height: .34in; }
  .ev .row .words { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 5px; }
  .ev .row .words span { border: 1.5px solid var(--ink); border-radius: 8px; height: .42in; }
  .done { border: 2.5px dashed var(--ink); border-radius: 10px; padding: 8px 12px; margin-top: 10px; font-size: 11.5pt; line-height: 1.5; }
  /* warrant */
  .warrant { border: 4px double var(--ink); padding: .45in; height: 100%; display: flex; flex-direction: column; }
  .warrant h1 { font-size: 36pt; letter-spacing: .08em; text-align: center; margin: 0; }
  .warrant .we { font-size: 17pt; line-height: 2.1; }
  .warrant .because { flex: 1; margin-top: 8px; }
  .warrant .because .line { height: 2.3em; }
  .match { font-size: 14pt; line-height: 2; }
  .match .chk { width: 20px; height: 20px; }
  .sigs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
  .sigs div { border-top: 1.5px solid var(--ink); padding-top: 4px; font-size: 9pt; color: var(--muted); text-align: center; }
  .seal { position: absolute; right: .9in; top: 1.1in; }
</style>
</head>
<body>
<div class="toolbar"><b>📁 Case file</b><span class="muted">8 pages · a case file and an arrest warrant for each squad, in squad colors. Print once, double-sided.</span><span class="grow"></span><a href="../../events/halloween.html#downloads">← Back to the plan</a><a href="../../downloads/halloween/case-file.pdf" download>⬇ PDF</a><button class="primary" onclick="window.print()">🖨 Print</button></div>

<script>
const STATIONS = { 1: ["Evidence Lab", "👣"], 2: ["Ghostbuster Lab", "👻"], 3: ["Cipher Room", "📜"], 4: ["Mummy Witness", "🧻"] };
const SQUADS = [["1", "Purple", "#5b21b6", false], ["2", "Black", "#111318", false], ["3", "Teal", "#0f766e", false], ["4", "Orange", "#ea580c", true]];
function casePage([n, color, hex, light]) {
  return `
<section class="page" style="--squad:${hex}">
  <div class="hdr">
    <div><span class="tape"><span>Confidential</span></span><div class="case" style="margin-top:8px">Mrs. Driscoll's Detective Bureau · Case #1031</div><h1 style="white-space:nowrap">The Case of the Missing Candy</h1></div>
    <div class="squadtag"><span class="badge${light ? " light" : ""}">Squad ${n} · ${color}</span></div>
  </div>
  <div class="stolen"><span>Stolen:</span><span class="big">THE CANDY JAR</span><span class="muted" style="white-space:nowrap">from the high shelf, yesterday afternoon.</span></div>

  <div class="sec">Clues <small>after each station, write down what you found</small></div>
  <div class="ev">
    <div class="row one"><b><span class="n">1</span>Evidence Lab</b><div class="w">The footprint is shoe size <span class="wl" style="flex:0 0 1.2in"></span></div></div>
    <div class="row"><div class="top"><b><span class="n">2</span>Ghostbuster Lab</b><span class="w" style="margin:0 0 0 14px">The ghosts say:</span></div><div class="words"><span></span><span></span><span></span><span></span><span></span></div></div>
    <div class="row"><div class="top"><b><span class="n">3</span>Cipher Room</b><span class="w" style="margin:0 0 0 14px;flex:1">The hidden P.S. says: <span class="wl"></span></span></div><div class="w"><span class="wl"></span></div></div>
    <div class="row one"><b><span class="n">4</span>Mummy Witness</b><div class="w">The thief REALLY likes <span class="wl"></span></div></div>
  </div>


  <div class="rule">A clue tells you who DIDN'T do it. Draw a line through any suspect who doesn't match. ✗</div>
  <div class="sec">Suspects <small>the one left standing is your thief</small></div>
  <table class="sus">
    <thead><tr><th>Name</th><th>Shoe</th><th>Yesterday afternoon</th><th>Wore</th><th>Squishies?</th><th>Statement</th></tr></thead>
    <tbody>
      <tr><td><strong>The Principal</strong></td><td>9</td><td>Off campus, 1:00–3:00</td><td>Orange</td><td>Loves them</td><td>Video 1</td></tr>
      <tr><td><strong>The Reading Specialist</strong></td><td>9</td><td>Reading room, all afternoon</td><td>Orange</td><td>Doesn't get them</td><td>Video 2</td></tr>
      <tr><td><strong>The Librarian</strong></td><td>7</td><td>Shelving, 2:00–2:30</td><td>Orange</td><td>Loves them</td><td><em>Declined</em></td></tr>
      <tr><td><strong>The Custodian</strong></td><td>9</td><td>In the building, all afternoon</td><td>Gray</td><td>Loves them</td><td><em>Declined</em></td></tr>
      <tr><td colspan="6"><strong>Someone else?</strong> &nbsp;Name: <span class="blank" style="min-width:2.6in"></span></td></tr>
    </tbody>
  </table>

  <div class="done"><strong>All four clues in?</strong> Every suspect crossed off? Tell the Detective: "Our list is too short." Then write your Arrest Warrant (next page) and drop it in the cauldron.</div>
  <div class="footer-note"><span>Mrs. Driscoll's Detective Bureau · Case #1031</span><span>Keep this file with your squad.</span></div>
</section>
<section class="page fill" style="--squad:${hex}">
  <div class="warrant">
    <div class="seal"><span class="stamp">Official</span></div>
    <div class="case center" style="font-family:Fredoka;font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Mrs. Driscoll's Detective Bureau · Case #1031</div>
    <h1>Arrest Warrant</h1>
    <div class="we" style="margin-top:14px">We, the detectives of <span class="sq${light ? " light" : ""}">Squad ${n} · ${color}</span>, accuse</div>
    <div class="line" style="height:.75in;border-bottom-width:2.5px"></div>
    <div class="we" style="margin-top:6px">of taking the Jar, because:</div>
    <div class="because lines"><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span></div>
    <div class="we" style="font-size:14pt;margin-top:8px">They match all four clues: <span class="small muted">(check each one)</span></div>
    <div class="match" style="display:grid;grid-template-columns:1fr 1fr"><span><span class="chk"></span> Shoe size 9</span><span><span class="chk"></span> In the building at 2:15</span><span><span class="chk"></span> Wore orange</span><span><span class="chk"></span> REALLY likes squishies</span></div>
    <div class="sigs"><div>Detective</div><div>Detective</div><div>Detective</div><div>Detective</div><div>Detective</div></div>
    <p class="center small muted" style="margin:14px 0 0">Fold once. Drop in the cauldron.</p>
  </div>
</section>`;
}
document.write(SQUADS.map(casePage).join(""));
</script>
</body>
</html>
