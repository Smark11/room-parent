<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case File · The Case of the Missing Candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../print.css">
<style>
  .hdr { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; padding-top: 8px; }
  .hdr .case { font-family: "Fredoka", sans-serif; font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hdr h1 { font-size: 26pt; margin: 4px 0 0; }
  .squadtag { text-align: right; }
  .squadtag .name { font-family: "Fredoka", sans-serif; font-size: 16pt; font-weight: 600; margin-left: auto; }
  .page { --squad: #5b21b6; }
  .stolen { border: 2.5px solid var(--ink); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; font-size: 11.5pt; }
  .stolen .big { font-family: "Fredoka", sans-serif; font-size: 18pt; letter-spacing: .06em; white-space: nowrap; }
  .sec { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 13pt; margin: 12px 0 6px; display: flex; align-items: center; gap: 8px; }
  .sec::after { content: ""; flex: 1; border-top: 1.5px solid var(--line); }
  .sec small { font-family: "Nunito", sans-serif; font-weight: 400; font-size: 9.5pt; color: var(--muted); }
  table.sus { font-size: 11pt; }
  table.sus td, table.sus th { padding: 6px 8px; }
  table.sus td:first-child { width: 34px; text-align: center; }
  table.sus td:first-child .chk { width: 20px; height: 20px; }
  .rule { border: 2.5px solid var(--ink); border-radius: 10px; padding: 8px 12px; margin: 10px 0 0; font-size: 11.5pt; font-weight: 800; text-align: center; }
  .ev { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .ev .row { border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; grid-template-columns: 1.55in 1fr 1.9in; gap: 12px; align-items: end; font-size: 11.5pt; }
  .ev .row b { font-family: "Fredoka", sans-serif; font-weight: 600; white-space: nowrap; }
  .ev .row .f { display: flex; gap: 6px; align-items: flex-end; white-space: nowrap; }
  .ev .row .f .blank { flex: 1; min-width: 0; }
  .ev .row .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--squad); color: #fff; font-size: 10pt; margin-right: 5px; }
  .ev .row .x { font-weight: 800; }
  .order { display: flex; gap: 6px; align-items: center; font-size: 10pt; flex-wrap: nowrap; }
  .order .st { border: 2px solid var(--squad); border-radius: 8px; padding: 3px 8px; font-weight: 800; white-space: nowrap; }
  .order .arrow { color: var(--muted); }
  .done { border: 2.5px dashed var(--ink); border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: 11.5pt; line-height: 1.5; }
  /* warrant */
  .warrant { border: 4px double var(--ink); padding: .45in; height: 100%; display: flex; flex-direction: column; }
  .warrant h1 { font-size: 36pt; letter-spacing: .08em; text-align: center; margin: 0; }
  .warrant .we { font-size: 17pt; line-height: 2.1; }
  .warrant .because { flex: 1; margin-top: 8px; }
  .warrant .because .line { height: 2.3em; }
  .match { font-size: 14pt; line-height: 2; }
  .match .chk { width: 20px; height: 20px; }
  .sigs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
  .sigs div { border-top: 1.5px solid var(--ink); padding-top: 4px; font-size: 9pt; color: var(--muted); text-align: center; }
  .seal { position: absolute; right: .9in; top: 1.1in; }
</style>
</head>
<body>
<div class="toolbar"><b>📁 Case file</b><span class="muted">2 pages · one case file and one arrest warrant. Print five (four squads and a spare).</span><span class="grow"></span><a href="../../events/halloween.html#downloads">← Back to the plan</a><a href="../../downloads/halloween/case-file.pdf" download>⬇ PDF</a><button class="primary" onclick="window.print()">🖨 Print</button></div>

<script>
const STATIONS = { 1: ["Evidence Lab", "👣"], 2: ["Ghostbuster Lab", "👻"], 3: ["Cipher Room", "📜"], 4: ["Mummy Witness", "🧻"] };
function casePage() {
  return `
<section class="page">
  <div class="hdr">
    <div><span class="tape"><span>Confidential</span></span><div class="case" style="margin-top:8px">Mrs. Driscoll's Detective Bureau · Case #1031</div><h1 style="white-space:nowrap">The Case of the Missing Candy</h1></div>
    <div class="squadtag"><div class="case">Squad</div><div class="name" style="border-bottom:2px solid #111;min-width:1.2in;height:1.3em"></div><div class="small muted" style="white-space:nowrap">1 purple · 2 black · 3 teal · 4 orange</div></div>
  </div>
  <div class="stolen"><span>Stolen:</span><span class="big">THE CANDY JAR</span><span class="muted" style="white-space:nowrap">from the high shelf, yesterday afternoon.</span><span class="muted small" style="margin-left:auto;white-space:nowrap">New info? Fix it: </span><span class="blank" style="min-width:1.2in"></span></div>

  <div class="sec">Suspects <small>from their statement forms, or from Bureau records if they declined to comment</small></div>
  <table class="sus">
    <thead><tr><th></th><th>Name</th><th>Shoe size</th><th>Yesterday afternoon</th><th>Wore</th><th>Squishies?</th><th>Statement</th></tr></thead>
    <tbody>
      <tr><td><span class="chk"></span></td><td><strong>The Principal</strong></td><td>9</td><td>Off campus, 1:00 to 3:00</td><td>Orange</td><td>Loves them</td><td>Video 1</td></tr>
      <tr><td><span class="chk"></span></td><td><strong>The Reading Specialist</strong></td><td>9</td><td>Reading room, all afternoon</td><td>Orange</td><td>Doesn't get them</td><td>Video 2</td></tr>
      <tr><td><span class="chk"></span></td><td><strong>The Librarian</strong></td><td>7</td><td>Shelving, 2:00 to 2:30</td><td>Orange</td><td>Loves them</td><td><em>Declined</em></td></tr>
      <tr><td><span class="chk"></span></td><td><strong>The Custodian</strong></td><td>9</td><td>In the building, all afternoon</td><td>Gray</td><td>Loves them</td><td><em>Declined</em></td></tr>
      <tr><td><span class="chk"></span></td><td><span class="blank" style="min-width:1.4in"></span><div class="tiny muted">Anyone else?</div></td><td><span class="blank short"></span></td><td><span class="blank" style="min-width:1.1in"></span></td><td><span class="blank short"></span></td><td><span class="blank" style="min-width:.9in"></span></td><td></td></tr>
    </tbody>
  </table>
  <div class="rule">A clue tells you who DIDN'T do it. Doesn't match the clue? Cross them off. ✗</div>

  <div class="sec">Clues <small>write each one in, then cross off the suspect who doesn't match</small></div>
  <div class="ev">
    <div class="row"><b><span class="n">1</span>Evidence Lab</b><span class="f">The footprint is shoe size <span class="blank short" style="flex:0 0 .7in"></span></span><span class="x">Cross off: <span class="blank" style="min-width:1.1in"></span></span></div>
    <div class="row"><b><span class="n">2</span>Ghostbuster Lab</b><span class="f">The ghosts say: <span class="blank"></span></span><span class="x">Cross off: <span class="blank" style="min-width:1.1in"></span></span></div>
    <div class="row"><b><span class="n">3</span>Cipher Room</b><span class="f">The hidden P.S. says: <span class="blank"></span></span><span class="x">Cross off: <span class="blank" style="min-width:1.1in"></span></span></div>
    <div class="row"><b><span class="n">4</span>Mummy Witness</b><span class="f">The thief REALLY likes: <span class="blank"></span></span><span class="x">Cross off: <span class="blank" style="min-width:1.1in"></span></span></div>
  </div>

  <div class="sec">Your stations <small>start at your squad number, then count up. After 4 comes 1.</small></div>
  <div class="order">${[1,2,3,4].map((n, i) => `<span class="st">${STATIONS[n][1]} ${n} · ${STATIONS[n][0]}</span>${i < 3 ? '<span class="arrow">→</span>' : ''}`).join("")}</div>

  <div class="done"><strong>All four clues in?</strong> Everyone crossed off? Tell the Detective: "Our list is too short." Then write your Arrest Warrant (next page) and drop it in the cauldron.</div>
  <div class="footer-note"><span>Mrs. Driscoll's Detective Bureau · Case #1031</span><span>Keep this file with your squad.</span></div>
</section>
<section class="page fill">
  <div class="warrant">
    <div class="seal"><span class="stamp">Official</span></div>
    <div class="case center" style="font-family:Fredoka;font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Mrs. Driscoll's Detective Bureau · Case #1031</div>
    <h1>Arrest Warrant</h1>
    <div class="we" style="margin-top:14px">We, the detectives of Squad <span class="blank" style="min-width:.6in"></span>, accuse</div>
    <div class="line" style="height:.75in;border-bottom-width:2.5px"></div>
    <div class="we" style="margin-top:6px">of taking the Jar, because:</div>
    <div class="because lines"><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span><span class="line"></span></div>
    <div class="we" style="font-size:14pt;margin-top:8px">They match all four clues: <span class="small muted">(check each one)</span></div>
    <div class="match" style="display:grid;grid-template-columns:1fr 1fr"><span><span class="chk"></span> Shoe size 9</span><span><span class="chk"></span> In the building at 2:15</span><span><span class="chk"></span> Wore orange</span><span><span class="chk"></span> REALLY likes squishies</span></div>
    <div class="sigs"><div>Detective</div><div>Detective</div><div>Detective</div><div>Detective</div><div>Detective</div></div>
    <p class="center small muted" style="margin:14px 0 0">Fold once. Drop in the cauldron.</p>
  </div>
</section>`;
}
document.write(casePage());
</script>
</body>
</html>
