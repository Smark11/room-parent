<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness Statements · Mummy Witness</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../print.css">
<style>
  .half { height: 4.85in; display: flex; flex-direction: column; background: var(--cream); border: 1px solid #d9cfb8; padding: .35in .45in; background-image: repeating-linear-gradient(transparent 0 .36in, rgba(0,0,0,.06) .36in calc(.36in + 1px)); }
  .half .head { display: flex; justify-content: space-between; font-size: 9pt; letter-spacing: .14em; text-transform: uppercase; color: #8a6d00; font-weight: 800; margin-bottom: 10px; }
  .half h2 { font-size: 16pt; margin-bottom: 8px; }
  .half p { font-size: 14pt; line-height: 1.55; margin: 0; }
  .half .sig { margin-top: auto; font-family: "Fredoka", sans-serif; font-size: 15pt; text-align: right; color: #444; }
  .labels { display: grid; grid-template-columns: 1fr 1fr; gap: .25in; }
  .label { border: 2.5px solid var(--ink); border-radius: 12px; padding: 14px 16px; height: 2.2in; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .label .big { font-family: "Fredoka", sans-serif; font-size: 20pt; font-weight: 600; }
  .label .squad { font-family: "Fredoka", sans-serif; font-size: 22pt; color: var(--teal-dark, #0f766e); }
</style>
</head>
<body>
<div class="toolbar"><b>🧻 Witness statements</b><span class="muted">2 pages · the statement (print it twice for four copies) and the envelope labels</span><span class="grow"></span><a href="../../events/halloween.html#downloads">← Back to the plan</a><a href="../../downloads/halloween/witness-statements.pdf" download>⬇ PDF</a><button class="primary" onclick="window.print()">🖨 Print</button></div>
<script>
const W = [
  ["", "", "", `I was on the shelf. I'm always on the shelf. Nobody notices a mummy on a shelf. Somebody picked up the Jar, held it very close, reached straight in through all the others, and pulled out <strong>the avocado one</strong>. First try. Without looking. <strong>Only a true fan knows where the avocado is.</strong> They <strong>squeezed it</strong> and whispered, <strong>"so satisfying."</strong> Then they put it back, patted the lid, and <strong>hugged</strong> the whole Jar out the door like a <strong>puppy</strong>. Nobody says "so satisfying" about candy.`],
];
const stmt = w => `<div class="half ${w[2]}"><div class="head"><span>Case #1031 · Witness statement</span><span>Mummies only</span></div><h2>Statement of the Mummy</h2><p>${w[3]}</p><div class="sig">— The Mummy (witness)</div></div>`;
let out = `<section class="page">${stmt(W[0])}<div class="cut"></div>${stmt(W[0])}</section>`;
out += `<section class="page"><span class="eyebrow teal">Envelope labels</span><h1>Witness box labels</h1><p class="muted">Four envelopes in the witness box, one statement each, all the same. Cut out and glue one label to each. Only a mummy may take one from the box, and each squad takes one.</p>
<div class="labels">${[1,2,3,4].map(() => `<div class="label"><div class="small muted" style="letter-spacing:.14em;text-transform:uppercase">Sealed witness statement</div><div class="squad">One per squad</div><div class="small">Only a mummy may open this.</div></div>`).join("")}</div>
<div class="box soft" style="margin-top:18px"><h4>Station lead: what it means</h4><p class="small" style="margin:0">Knew exactly where the avocado one was, squeezed it, whispered "so satisfying," hugged the Jar like a puppy. It all adds up to one fact: <strong>the thief loves squishies</strong>. That's Clue 4. If a squad reads it and says "so... they like squishies?", say: "Write that down, detective."</p></div>
<div class="box dashed"><h4>Witness box sign</h4><p class="center" style="font-family:Fredoka;font-size:22pt;margin:0">WITNESS BOX · MUMMIES ONLY</p></div>
</section>`;
document.write(out);
</script>
</body>
</html>
